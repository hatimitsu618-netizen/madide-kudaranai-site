<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>略称制作サイト</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
	<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>

<body>
	
	<h1 style="color: dimgray;">略称作成サイト</h1>
	
	<div id="main" class="box">
		<p class="text">好きなワードの略称をランダムで考えてくれます</p>
		
		<h1 id="result-text"></h1>
		
		<input type="text" id="user-input" placeholder="入力欄">
	</div>
	
	<div id="btn-main" class="box">
	<button id="make-btn1" class="btn">略称を作る</button>
	<button id="make-btn2" class="btn">リセット</button>
	<button id="make-btn3" class="btn">ヘイトモード</button>
	</div>
	
	<script type="py" src="main.py" config='{"terminal": false}'></script>
</body>
</html>
