<!DOCTYPE html>		<!再プッシュ用に変更>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>略称作成サイト</title>
	<link rel="stylesheet" href="style.css">
	<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
	<meta name="robots" content="noindex, nofollow">
</head>

<body>
	
	<h1 style="color: dimgray;">略称作成サイト</h1>
	<section id="auth-panel" class="box" aria-labelledby="auth-title">
		<h2 id="auth-title">ログイン</h2>
		<p id="auth-status" class="text" aria-live="polite">ログインすると略称の履歴を保存できます。</p>
		<button id="login-btn" class="btn" type="button">Googleでログイン</button>
		<button id="logout-btn" class="btn" type="button" hidden>ログアウト</button>
		<p id="auth-message" class="text" role="status" aria-live="polite"></p>
	</section>
	
	<div id="main" class="box">
		<p class="text">好きなワードの略称をランダムで考えてくれます</p>
		
		<h1 id="result-text"><ここに出力されます></h1>
		
		<input type="text" id="user-input" placeholder="入力欄">
	</div>
	
	<div id="btn-main" class="box">

	<button id="make-btn1" class="btn">略称を作る</button>
	<button id="make-btn2" class="btn">リセット</button>
	<button id="make-btn3" class="btn">おまかせワード</button>
	
	</div>

	<section id="history-panel" class="box" aria-labelledby="history-title" hidden>
		<h2 id="history-title">生成履歴</h2>
		<p id="history-status" class="text" aria-live="polite"></p>
		<ul id="history-list"></ul>
	</section>
	
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="indexjsfile/string.js"></script>
	<script src="indexjsfile/supabase.js"></script>
	<script src="indexjsfile/history.js"></script>
	<script src="indexjsfile/main.js"></script>
</body>
</html>
